[project]
name = "qverify"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Arvind Iyer", email = "arvind.iyer.2001@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "graphifyy>=0.9.97",
    "tree-sitter-q",
]

[project.scripts]
qverify = "qverify:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# wheelhouse: one tree-sitter-q wheel per platform (see scripts/build_grammar_wheel.sh); uv picks the matching one
find-links = ["vendor"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
